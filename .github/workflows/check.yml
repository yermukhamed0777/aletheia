name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Build and smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build bundle and run pass/fail check
        run: node check.mjs
