name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, lint, eval, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke check
        run: node check.mjs
      - name: Source lint
        run: node lint.mjs
      - name: Validation eval
        run: node eval.mjs
      - name: Build static bundle
        run: node bundle.mjs
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: aletheia-dist
          path: dist/index.html
          if-no-files-found: error
