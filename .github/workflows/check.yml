name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, lint, eval, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke check (includes unit harness)
        run: node check.mjs
      - name: Source lint
        run: node lint.mjs
      - name: Validation eval
        run: node eval.mjs
      - name: Fast unit harness
        run: node unit.mjs
      - name: Build static bundle
        run: node bundle.mjs
      - name: Browser smoke (root + subpath)
        run: node e2e.mjs
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: aletheia-dist
          path: |
            dist/index.html
            artifacts/walkthrough-ask.png
          if-no-files-found: error
